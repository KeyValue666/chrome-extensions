<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
    <title>XTab</title>
  </head>
  <body>
    <!-- 背景三层：壁纸 / 柔光与暗角 / 颗粒质感，分开是为了各自独立过渡 -->
    <div class="bg" id="bg" aria-hidden="true"></div>
    <div class="bg-overlay" id="bg-overlay" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="app">
      <aside class="dock" id="sidebar" aria-label="分组导航"></aside>

      <main class="stage">
        <div class="content">
          <section class="hero" id="hero">
            <button class="clock-button" id="clock-button" type="button" title="点击切换极简模式">
              <span class="clock" id="clock"></span>
              <span class="date" id="date"></span>
            </button>
            <div class="search" id="search"></div>
          </section>

          <section class="shortcuts-area" id="shortcuts" aria-label="快捷方式"></section>
        </div>
      </main>
    </div>

    <div class="toolbar" id="toolbar"></div>
    <div class="drawer-root" id="drawer-root"></div>
    <div class="dialog-root" id="dialog-root"></div>
    <!-- 待办与便签的宿体：不打开弹窗时不占布局，也不重复创建 DOM -->
    <div class="panel-holder" id="panel-holder" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
